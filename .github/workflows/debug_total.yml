name: debug-total

# TEMPORARY diagnostic (delete after use): does Cloudflare serve stale cached pages to GitHub runners, and does a cache-buster fix it?
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import re, time, urllib.request
          UA = {'User-Agent': 'Mozilla/5.0 (research data collection; contact: limhengue@gmail.com)'}
          B = 'https://www.taladnudbaan.com/properties?sellers_only_out=on&view=list&page_length=60'
          D = 'https://www.taladnudbaan.com/property/single-house/LED/2094797'
          def probe(label, url):
              r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60)
              t = re.sub(r'<[^>]+>', ' ', r.read().decode('utf-8', 'ignore'))
              m = re.search(r'ผลการค้นหา\s*:\s*([\d,]+)', t)
              print(f'{label:34s} total={m.group(1) if m else "-":>8s} cf-cache={r.headers.get("cf-cache-status")} age={r.headers.get("age")}')
          probe('list p1 (plain)', B + '&page=1')
          probe('list p1 + cb', B + f'&page=1&cb={int(time.time())}')
          probe('list p2 (plain)', B + '&page=2')
          probe('list p2 + cb', B + f'&page=2&cb={int(time.time())}x')
          probe('list p500 (plain)', B + '&page=500')
          probe('list p500 + cb', B + f'&page=500&cb={int(time.time())}y')
          probe('list city_id=3 (plain)', B + '&page=1&city_id=3')
          probe('list city_id=3 + cb', B + f'&page=1&city_id=3&cb={int(time.time())}z')
          probe('detail (plain)', D)
          probe('detail + cb', D + f'?cb={int(time.time())}')
          PY
