name: scrape-monthly-full-test

# ทดสอบ WORKERS=20 บน GitHub Actions (datacenter IP) manual dispatch เท่านั้น
# ไม่มี schedule - ยังไม่ commit เป็น production job จนกว่าจะยืนยันว่าไม่โดน block
on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'จำนวน parallel workers'
        default: '20'
      time_limit_min:
        description: 'จำกัดเวลาทดสอบ (นาที) - ไม่ต้องรันจนจบจริง แค่เช็ค error rate'
        default: '15'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rvest", "dplyr", "stringr", "purrr",
            "readr", "httr", "jsonlite", "future", "furrr"
          ))'

      - name: Run full scrape (limited time, high worker count - test only)
        env:
          WORKERS: ${{ github.event.inputs.workers }}
          TIME_LIMIT_MIN: ${{ github.event.inputs.time_limit_min }}
        run: Rscript scrape_monthly_full.R
