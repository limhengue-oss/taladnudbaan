name: test-probe-orphans

# ชั่วคราว: ดูว่ารายการที่ไม่ตกช่วงราคาไหนเลยเป็นแบบไหน และเว็บมีตัวกรองจับได้ไหม -> ลบหลังได้ผล
on:
  push:
    branches: [perf/list-sliced]
    paths: ['.github/workflows/test_probe_orphans.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: sudo apt-get update -q && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev
      - run: Rscript -e 'install.packages(c("rvest", "dplyr", "stringr", "purrr", "httr"))'
      - name: Probe orphans
        run: |
          cat > probe.R <<'RS'
          suppressMessages({library(rvest); library(dplyr); library(stringr); library(purrr)})
          base <- "https://www.taladnudbaan.com/properties?sellers_only_out=on&view=list"
          get <- function(e, pl = 60L, p = 1L) {
            Sys.sleep(0.3)
            read_html(httr::GET(paste0(base, e, "&page_length=", pl, "&page=", p, "&cb=", as.numeric(Sys.time())),
                                httr::user_agent("Mozilla/5.0 (research data collection; contact: limhengue@gmail.com)")))
          }
          n_of <- function(e) { m <- str_match(html_text2(get(e, 20L)), "ผลการค้นหา\\s*:\\s*([0-9,]+)")[, 2]; if (is.na(m)) 0L else as.integer(str_remove_all(m, ",")) }
          cards <- function(pg) {
            a <- html_elements(pg, xpath = "//a[contains(@href, '/property/')]")
            href <- html_attr(a, "href"); ok <- str_detect(href, "/property/[^/]+/[^/]+/[^/]+")
            a <- a[ok]
            tibble(url = url_absolute(html_attr(a, "href"), "https://www.taladnudbaan.com"),
                   card = map_chr(a, function(x) { c <- html_element(x, xpath = "ancestor::*[contains(., 'ปรับปรุงล่าสุด')][1]"); if (length(c)) str_squish(html_text2(c)) else "" })) |>
              distinct(url, .keep_all = TRUE)
          }
          all_pages <- function(e) { acc <- list(); for (p in 1:60) { d <- cards(get(e, 60L, p)); if (!nrow(d)) break; acc[[p]] <- d }; bind_rows(acc) |> distinct(url, .keep_all = TRUE) }
          prices <- c("&min=0&max=500000", "&min=500000&max=1000000", "&min=1000000&max=2000000",
                      "&min=2000000&max=3000000", "&min=3000000&max=4000000", "&min=4000000&max=5000000",
                      "&min=5000000&max=5000001", "&min=5000001")
          node <- "&city_id=215&sale_method=2&type_id=1"
          parent <- all_pages(node)
          kids   <- bind_rows(lapply(paste0(node, prices), all_pages)) |> distinct(url, .keep_all = TRUE)
          orph   <- parent |> filter(!url %in% kids$url)
          cat(sprintf("node %s: site n=%d, parent unique=%d, children unique=%d, orphans=%d\n", node, n_of(node), nrow(parent), nrow(kids), nrow(orph)))
          cat("\n--- orphan cards (first 8) ---\n"); for (i in seq_len(min(8, nrow(orph)))) cat(orph$url[i], "\n  ", substr(orph$card[i], 1, 300), "\n")
          cat("\n--- detail page meta/price of first 3 orphans ---\n")
          for (u in head(orph$url, 3)) {
            pg <- read_html(httr::GET(u)); Sys.sleep(0.3)
            cat(u, "\n  meta:", html_attr(html_element(pg, "meta[name=description]"), "content"), "\n")
            t <- html_text2(pg); cat("  ", str_squish(substr(t, regexpr("ราคา", t), regexpr("ราคา", t) + 200)), "\n")
          }
          cat("\n--- candidate filters on node (n) ---\n")
          for (f in c("", "&min=0", "&max=0", "&min=0&max=0", "&min=0&max=1", "&min=1", "&max=500000", "&min=0&max=499999",
                      "&min=500000&max=500000", "&min=1000000&max=1000000", "&price=0", "&no_price=1"))
            cat(sprintf("  %-28s %d\n", if (f == "") "(none)" else f, n_of(paste0(node, f))))
          RS
          Rscript probe.R
