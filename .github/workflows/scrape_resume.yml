name: scrape-resume

# ทำต่อจาก pending queue เดิมทุก 6 ชม. (ไม่ scrape list ใหม่) เผื่อ scrape_daily ทำไม่ทันในรอบเดียว
# ช่วงเวลาเว้น 6 ชม. จากรอบหลักที่ 17:00 UTC (00:00 ICT) ของ scrape-daily.yml
on:
  schedule:
    - cron: '0 23,5,11 * * *'
  workflow_dispatch:

concurrency:
  group: taladnudbaan-scrape
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rvest", "dplyr", "stringr", "purrr",
            "readr", "httr", "jsonlite", "blastula"
          ))'

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Download baseline + pending queue from Google Drive
        run: |
          rclone copy gdrive:taladnudbaan/taladnudbaan_urls.RData .
          rclone copy gdrive:taladnudbaan/taladnudbaan_pending.RData . || true

      - name: Resume scrape (skip list re-scrape)
        run: |
          export WORKFLOW_START_EPOCH=$(date +%s)
          export RESUME_ONLY=true
          Rscript scrape_daily.R

      - name: Upload output files to Google Drive
        if: success()
        run: |
          while IFS= read -r f; do
            [ -n "$f" ] && rclone copy "$f" gdrive:taladnudbaan/
          done < output_files.txt
          rclone copy taladnudbaan_urls.RData gdrive:taladnudbaan/
          rclone copy update_status.txt       gdrive:taladnudbaan/
          if [ -f taladnudbaan_pending.RData ]; then
            rclone copy taladnudbaan_pending.RData gdrive:taladnudbaan/
          else
            rclone deletefile gdrive:taladnudbaan/taladnudbaan_pending.RData || true
          fi

      - name: Notify email
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
        run: |
          Rscript -e '
          library(blastula)
          user   <- Sys.getenv("GMAIL_USER")
          pass   <- Sys.getenv("GMAIL_APP_PASSWORD")
          status <- Sys.getenv("JOB_STATUS")
          stamp  <- format(Sys.time(), "%Y%m%d_%H%M")
          if (!nzchar(user) || !nzchar(pass)) quit(save = "no")

          update_line <- tryCatch(readLines("update_status.txt", warn=FALSE)[1], error=function(e) "unknown")

          # ไม่มี pending -> ไม่ต้องส่งเมล กัน spam ทุก 6 ชม.
          if (identical(update_line, "no_pending") && identical(status, "success")) quit(save = "no")

          parts  <- strsplit(update_line, "\\|")[[1]]
          total  <- sub("total:", "", parts[grepl("^total:", parts)])
          done   <- sub("done:",  "", parts[grepl("^done:",  parts)])
          todo   <- if (grepl("^unupdated:", parts[1])) sub("unupdated:", "", parts[1]) else "0"
          summary_line <- paste0("อัพเดทแล้ว: ", done, " / ", total,
                                 " | ค้าง: ", todo, " รายการ")

          smtp_send(
            compose_email(body = md(paste0(
              "taladnudbaan resume scrape: **", status, "**\n\n",
              "เวลา: ", Sys.time(), "\n\n",
              summary_line
            ))),
            to          = c(user, "wasinr@bot.or.th"),
            from        = user,
            subject     = paste0("[taladnudbaan] resume ", status, " ", stamp),
            credentials = creds_envvar(
              user        = user,
              pass_envvar = "GMAIL_APP_PASSWORD",
              host        = "smtp.gmail.com",
              port        = 465,
              use_ssl     = TRUE
            )
          )'
