name: test-probe-partition

# ชั่วคราว: เช็กว่าผลรวมยอดของส่วนย่อย (type / ช่วงราคา) เท่ากับยอดของส่วนแม่ไหม -> ลบหลังได้ผล
on:
  push:
    branches: [perf/list-sliced]
    paths: ['.github/workflows/test_probe_partition.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: sudo apt-get update -q && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev
      - run: Rscript -e 'install.packages(c("rvest", "dplyr", "stringr", "purrr", "httr"))'
      - name: Probe partitions
        run: |
          Rscript -e '
          suppressMessages({library(rvest); library(dplyr); library(stringr); library(purrr)})
          base <- "https://www.taladnudbaan.com/properties?sellers_only_out=on&view=list&page_length=20&page=1"
          n_of <- function(e) {
            Sys.sleep(0.3)
            pg <- read_html(httr::GET(paste0(base, e, "&cb=", as.numeric(Sys.time())), httr::user_agent("Mozilla/5.0 (research data collection; contact: limhengue@gmail.com)")))
            m <- str_match(html_text2(pg), "ผลการค้นหา\\s*:\\s*([0-9,]+)")[, 2]
            if (is.na(m)) 0L else as.integer(str_remove_all(m, ","))
          }
          types  <- paste0("&type_id=", 1:9)
          prices <- c("&min=0&max=500000", "&min=500000&max=1000000", "&min=1000000&max=2000000",
                      "&min=2000000&max=3000000", "&min=3000000&max=4000000", "&min=4000000&max=5000000",
                      "&min=5000000&max=5000001", "&min=5000001")
          check <- function(parent, kids) {
            np <- n_of(parent); nk <- vapply(paste0(parent, kids), n_of, integer(1))
            cat(sprintf("%-45s parent=%5d  sum(children)=%5d  gap=%5d\n", parent, np, sum(nk), np - sum(nk)))
          }
          for (e in c("&city_id=215&sale_method=2", "&city_id=215&sale_method=1", "&city_id=142&sale_method=1",
                      "&city_id=652&sale_method=2", "&sale_method=2", "&sale_method=1")) check(e, types)
          for (e in c("&city_id=215&sale_method=2&type_id=1", "&city_id=215&sale_method=2&type_id=3",
                      "&city_id=142&sale_method=1&type_id=3", "&sale_method=2&type_id=1", "&sale_method=1&type_id=1")) check(e, prices)
          cat("\nsale_method split of whole site:\n"); check("", c("&sale_method=1", "&sale_method=2"))
          '
