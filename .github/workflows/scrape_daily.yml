name: scrape-daily

on:
  schedule:
    - cron: '0 17 * * *'   # ทุกวัน 17:00 UTC = 00:00 ICT
  workflow_dispatch:
  # รันเพิ่มทันทีที่ scrape-monthly เสร็จ (full re-scrape + rebuild baseline รายเดือน)
  # เพื่อไล่จับ url ที่อาจ "flicker" หายไปช่วงที่ full scrape กำลังไล่ list ของตัวเอง
  # ใช้ workflow_run แทนตั้งเวลาคงที่ (เช่น 6:00 AM) เพราะ full scrape ใช้เวลาไม่แน่นอน
  # (วัดได้จริง ~5.2 ชม. แต่ไม่การันตี) ตั้งเวลาคงที่เสี่ยง race กับตอนที่มันเสร็จจริง
  workflow_run:
    workflows: ["scrape-monthly"]
    types: [completed]

concurrency:
  group: taladnudbaan-scrape
  cancel-in-progress: false

jobs:
  daily:
    # ถ้า trigger มาจาก scrape-monthly ให้รันเฉพาะตอน monthly สำเร็จเท่านั้น
    # (schedule/workflow_dispatch ปกติไม่ต้องเช็คเงื่อนไขนี้)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rvest", "dplyr", "stringr", "purrr",
            "readr", "httr", "jsonlite", "blastula", "future", "furrr"
          ))'

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Download baseline from Google Drive
        run: rclone copy gdrive:taladnudbaan/taladnudbaan_urls.RData .

      - name: Run daily scrape
        env:
          WORKERS: '10'
        run: |
          export WORKFLOW_START_EPOCH=$(date +%s)
          Rscript scrape_daily.R

      - name: Upload output files to Google Drive
        if: success()
        run: |
          while IFS= read -r f; do
            [ -n "$f" ] && rclone copy "$f" gdrive:taladnudbaan/
          done < output_files.txt
          rclone copy taladnudbaan_urls.RData gdrive:taladnudbaan/
          rclone copy update_status.txt       gdrive:taladnudbaan/
          if [ -f taladnudbaan_pending.RData ]; then
            rclone copy taladnudbaan_pending.RData gdrive:taladnudbaan/
          else
            rclone deletefile gdrive:taladnudbaan/taladnudbaan_pending.RData || true
          fi

      - name: Notify email
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
        run: |
          Rscript -e '
          library(blastula)
          user   <- Sys.getenv("GMAIL_USER")
          pass   <- Sys.getenv("GMAIL_APP_PASSWORD")
          status <- Sys.getenv("JOB_STATUS")
          stamp  <- format(Sys.Date(), "%Y%m%d")
          if (!nzchar(user) || !nzchar(pass)) quit(save = "no")

          # อ่าน update_status.txt
          update_line <- tryCatch(readLines("update_status.txt", warn=FALSE)[1], error=function(e) "unknown")
          parts  <- strsplit(update_line, "\\|")[[1]]
          total  <- sub("total:", "", parts[grepl("^total:", parts)])
          done   <- sub("done:",  "", parts[grepl("^done:",  parts)])
          todo   <- if (grepl("^unupdated:", parts[1])) sub("unupdated:", "", parts[1]) else "0"
          summary_line <- paste0("อัพเดทแล้ว: ", done, " / ", total,
                                 " | ค้าง: ", todo, " รายการ")

          smtp_send(
            compose_email(body = md(paste0(
              "taladnudbaan daily scrape: **", status, "**\n\n",
              "วันที่: ", Sys.Date(), "\n\n",
              summary_line
            ))),
            to          = c(user, "wasinr@bot.or.th"),
            from        = user,
            subject     = paste0("[taladnudbaan] daily ", status, " ", stamp),
            credentials = creds_envvar(
              user        = user,
              pass_envvar = "GMAIL_APP_PASSWORD",
              host        = "smtp.gmail.com",
              port        = 465,
              use_ssl     = TRUE
            )
          )'
