name: scrape-monthly

# rebuild taladnudbaan_properties.csv + taladnudbaan_urls.RData (baseline) จาก
# full re-scrape จริง (scrape_monthly_full.R, REBUILD_MAIN=true) แทนของเดิมที่ diff
# จาก changelog รายเดือน (scrape_monthly.R เดิม - เจอบั๊ก orphaned-month + removed ค้าง
# สะสม จึงเลิกใช้) -> full scrape ไม่พึ่ง baseline/changelog เดิมเลย รีเซ็ตสะอาดทุกเดือน
on:
  schedule:
    - cron: '0 18 1 * *'   # วันที่ 1 ของทุกเดือน 18:00 UTC = 01:00 ICT
  workflow_dispatch:

concurrency:
  group: taladnudbaan-scrape
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # เผื่อ ~5.2 ชม. ที่วัดได้จริงจากการทดสอบ WORKERS=20 บน GH Actions + buffer

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rvest", "dplyr", "stringr", "purrr",
            "readr", "httr", "jsonlite", "future", "furrr", "blastula"
          ))'

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Download current properties.csv (สำหรับ backup ก่อนเขียนทับ)
        run: rclone copy gdrive:taladnudbaan/taladnudbaan_properties.csv . || true

      - name: Run full re-scrape + rebuild properties.csv + baseline
        env:
          WORKERS: '20'
          REBUILD_MAIN: 'true'
        run: Rscript scrape_monthly_full.R

      - name: Upload output files to Google Drive
        if: success()
        run: |
          while IFS= read -r f; do
            [ -n "$f" ] && rclone copy "$f" gdrive:taladnudbaan/
          done < output_files_full.txt
          rclone copy taladnudbaan_properties_backup_*.csv gdrive:taladnudbaan/ || true

      - name: Notify email
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
        run: |
          Rscript -e '
          library(blastula)
          user   <- Sys.getenv("GMAIL_USER")
          pass   <- Sys.getenv("GMAIL_APP_PASSWORD")
          status <- Sys.getenv("JOB_STATUS")
          if (!nzchar(user) || !nzchar(pass)) quit(save = "no")
          smtp_send(
            compose_email(body = md(paste0(
              "taladnudbaan monthly full re-scrape + baseline rebuild: **", status, "**\n\n",
              "วันที่: ", Sys.Date()
            ))),
            to          = c(user, "wasinr@bot.or.th"),
            from        = user,
            subject     = paste0("[taladnudbaan] monthly full-rebuild ", status, " ", format(Sys.Date(), "%Y%m%d")),
            credentials = creds_envvar(
              user        = user,
              pass_envvar = "GMAIL_APP_PASSWORD",
              host        = "smtp.gmail.com",
              port        = 465,
              use_ssl     = TRUE
            )
          )'
