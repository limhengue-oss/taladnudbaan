name: site-count

# บันทึกจำนวนทรัพย์ที่เว็บ taladnudbaan.com รายงานเอง ("ผลการค้นหา : N รายการทรัพย์") วันละครั้ง
# ไฟล์บน Google Drive (gdrive:taladnudbaan/):
#   site_count_log.csv        : date_ict, timestamp_utc, site_total              (ยอดรวม 1 แถว/วัน)
#   site_count_breakdown.csv  : date_ict, level, province_id, province_name, type_id, type_slug, sale_method, total
#       level = overall | type (9 ประเภท) | province (ราย จังหวัด) | province_type (จังหวัด x ประเภท)
#       sale_method = all | sale (รายการขาย) | auction (รายการประมูล)  (แถว all = sale + auction)
# ราว 1,700 request/วัน (4 thread) ใช้เวลา ~7 นาที ไม่ผูกกับ scrape-daily ที่ไล่ list เอง
on:
  schedule:
    - cron: '5 0 * * *'          # 00:05 เวลาไทยทุกวัน
      timezone: 'Asia/Bangkok'
  workflow_dispatch:

concurrency:
  group: taladnudbaan-site-count   # คนละกลุ่มกับ scrape หลัก ไม่ต้องรอคิว
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Read site totals and write today's rows to the logs on Drive
        run: python3 site_count.py

      - name: Email me if this job failed
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_SUBJECT: '[taladnudbaan] site-count FAILED'
          NOTIFY_BODY: 'The daily site-count job failed (website layout changed, blocked, or Drive error). No rows were written today.'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 notify_failure.py
