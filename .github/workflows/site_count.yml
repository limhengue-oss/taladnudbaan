name: site-count

# บันทึกจำนวนทรัพย์ที่เว็บ taladnudbaan.com รายงานเอง ("ผลการค้นหา : N รายการทรัพย์") วันละครั้ง
# ต่อท้ายไฟล์ site_count_log.csv บน Google Drive (date_ict, timestamp_utc, site_total)
# ใช้ 1 request/วัน ไม่ผูกกับ scrape-daily (ที่ใช้เวลานานและไล่ list เอง) เพื่อให้ได้ตัวเลขเทียบเสมอ
on:
  schedule:
    - cron: '5 0 * * *'          # 00:05 เวลาไทยทุกวัน
      timezone: 'Asia/Bangkok'
  workflow_dispatch:

concurrency:
  group: taladnudbaan-site-count   # คนละกลุ่มกับ scrape หลัก ไม่ต้องรอคิว
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Read site total and append to log on Drive
        run: |
          python3 - <<'EOF'
          import re, sys, subprocess, urllib.request, datetime, zoneinfo
          url = "https://www.taladnudbaan.com/properties?sellers_only_out=on&view=list&page_length=20&page=1"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (research data collection; contact: limhengue@gmail.com)"})
          html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "ignore")
          text = re.sub(r"<[^>]+>", " ", html)
          m = re.search(r"ผลการค้นหา\s*:\s*([\d,]+)", text)
          if not m:
              sys.exit("cannot find the site total on the page (layout changed or blocked?)")
          total = int(m.group(1).replace(",", ""))
          now = datetime.datetime.now(datetime.timezone.utc)
          ict = now.astimezone(zoneinfo.ZoneInfo("Asia/Bangkok")).date().isoformat()
          remote = "gdrive:taladnudbaan/site_count_log.csv"
          subprocess.run(["rclone", "copyto", remote, "site_count_log.csv"], check=False)   # ไม่มีไฟล์ = เริ่มใหม่
          try:
              existing = open("site_count_log.csv", encoding="utf-8").read()
          except FileNotFoundError:
              existing = ""
          if not existing.strip():
              existing = "date_ict,timestamp_utc,site_total\n"
          if not existing.endswith("\n"):
              existing += "\n"
          existing += f"{ict},{now.strftime('%Y-%m-%dT%H:%M:%SZ')},{total}\n"
          open("site_count_log.csv", "w", encoding="utf-8").write(existing)
          subprocess.run(["rclone", "copyto", "site_count_log.csv", remote], check=True)
          print(f"site total = {total} on {ict}")
          EOF
